<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korea 26 — Bucketlist</title>
  <meta name="description" content="Korea 26 · Bucketlist · 5.–17. Oktober 2026.">
  <meta name="theme-color" content="#0a0a0c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Korea 26 — Bucketlist">
  <meta property="og:description" content="Bucketlist · Korea 26 · 5.–17. Oktober 2026.">
  <meta property="og:url" content="https://yelggy.github.io/seoul26/wunschliste.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Korea 26 — Bucketlist">
  <meta name="twitter:description" content="Bucketlist · Korea 26 · 5.–17. Oktober 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css?v=9">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="hero-kicker">Bucketlist</p>
      <h1>Korea 26</h1>
      <p class="hero-sub">5.–17. Oktober 2026</p>
      <nav class="tabs" aria-label="Seiten">
        <a href="./">Route</a>
        <a href="./wunschliste.html" aria-current="page">Bucketlist</a>
        <a href="./karte.html">Karte</a>
      </nav>
    </header>

    <section class="bucket" id="bucket" aria-labelledby="bucket-title">
      <div id="bucket-list-view">
        <header class="bucket-head">
          <h2 id="bucket-title" tabindex="-1">Bucketlist</h2>
        </header>
        <div class="bucket-filter" role="group" aria-label="Bucketlist filtern">
          <button type="button" class="bucket-filter-btn is-on" data-filter="all" aria-pressed="true">Alle</button>
          <button type="button" class="bucket-filter-btn" data-filter="Cyrill" aria-pressed="false">Cyrill</button>
        </div>
        <ul class="bucket-entries" id="bucket-list"></ul>
      </div>

      <article class="bucket-detail" id="bucket-detail" hidden>
        <button type="button" class="btn detail-back" id="bucket-back">Zurück</button>
        <h2 id="detail-name"></h2>
        <div class="detail-photos" id="detail-images" hidden></div>
        <p class="detail-note" id="detail-note" hidden></p>
        <p class="detail-reviews">Fotos und Bewertungen stehen auf Google Maps.</p>
        <div class="detail-actions">
          <a id="detail-photos" href="#" target="_blank" rel="noopener noreferrer">Fotos auf Google Maps</a>
          <a id="detail-maps" href="#" target="_blank" rel="noopener noreferrer">In Google Maps öffnen</a>
          <a id="detail-kakao" href="#" target="_blank" rel="noopener noreferrer" hidden>In KakaoMap öffnen</a>
        </div>
        <div class="detail-map" id="detail-map-wrap" hidden>
          <iframe id="detail-map" title="Karte" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </article>
    </section>

    <footer class="footer">
      <p>Korea 26</p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(function () {
  "use strict";
  var SECRET_PATTERNS = [
    /\b(pass(word|wort)|kennwort|passwd|pwd)\s*[:=]/i,
    /\b(api[_-]?key|secret[_-]?key|access[_-]?token|private[_-]?key|client[_-]?secret|authorization)\b/i,
    /\b(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(live|test)_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})/,
    /-----BEGIN [A-Z0-9 ]+PRIVATE KEY-----/,
    /\bBearer\s+[A-Za-z0-9\-._~+/]+=*/
  ];
  var listEl = document.getElementById("bucket-list");
  var listView = document.getElementById("bucket-list-view");
  var detailEl = document.getElementById("bucket-detail");
  var toastEl = document.getElementById("toast");
  var detailName = document.getElementById("detail-name");
  var detailImages = document.getElementById("detail-images");
  var detailNote = document.getElementById("detail-note");
  var detailPhotos = document.getElementById("detail-photos");
  var detailMaps = document.getElementById("detail-maps");
  var detailKakao = document.getElementById("detail-kakao");
  var detailMapWrap = document.getElementById("detail-map-wrap");
  var detailMap = document.getElementById("detail-map");
  var items = [];
  var filter = "all";

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-show");
    setTimeout(function () { toastEl.classList.remove("is-show"); }, 2200);
  }

  function looksSensitive(text) {
    var s = String(text || "");
    if (!s) return false;
    for (var i = 0; i < SECRET_PATTERNS.length; i++) {
      if (SECRET_PATTERNS[i].test(s)) return true;
    }
    var digits = s.replace(/\D/g, "");
    return digits.length >= 13 && digits.length <= 19 && /\d(?:[ -]?\d){12,18}/.test(s);
  }

  function isHttp(url) {
    return /^https?:\/\//i.test(url || "");
  }

  function safeImage(path) {
    return /^assets\/places\/[a-z0-9-]+\/[123]\.jpe?g$/i.test(path || "");
  }

  function finiteCoord(value) {
    if (value === null || value === undefined || value === "") return NaN;
    var n = Number(value);
    return isFinite(n) ? n : NaN;
  }

  function kakaoMapUrl(name, lat, lng) {
    if (!name || !isFinite(lat) || !isFinite(lng)) return "";
    return "https://map.kakao.com/link/map/" + encodeURIComponent(name) + "," + lat + "," + lng;
  }

  function queryFromMaps(url) {
    try {
      var u = new URL(url);
      return u.searchParams.get("query") || u.searchParams.get("q") || "";
    } catch (e) {
      return "";
    }
  }

  function hashId() {
    return decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  }

  function showList() {
    detailMap.removeAttribute("src");
    detailEl.hidden = true;
    listView.hidden = false;
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    var title = document.getElementById("bucket-title");
    if (title) title.focus();
  }

  function showDetail(item, fromHash) {
    detailName.textContent = item.name;
    detailImages.innerHTML = "";
    var photosOnPage = (item.images || []).filter(safeImage);
    if (photosOnPage.length) {
      detailImages.hidden = false;
      photosOnPage.forEach(function (src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = item.name;
        detailImages.appendChild(img);
      });
    } else {
      detailImages.hidden = true;
    }
    if (item.note) {
      detailNote.hidden = false;
      detailNote.textContent = item.note;
    } else {
      detailNote.hidden = true;
      detailNote.textContent = "";
    }
    var photos = isHttp(item.photos) ? item.photos : (isHttp(item.maps) ? item.maps : "");
    var maps = isHttp(item.maps) ? item.maps : photos;
    if (photos) {
      detailPhotos.hidden = false;
      detailPhotos.href = photos;
    } else {
      detailPhotos.hidden = true;
    }
    if (maps) {
      detailMaps.hidden = false;
      detailMaps.href = maps;
    } else {
      detailMaps.hidden = true;
    }
    var kakao = kakaoMapUrl(item.name, item.lat, item.lng);
    if (kakao) {
      detailKakao.hidden = false;
      detailKakao.href = kakao;
    } else {
      detailKakao.hidden = true;
      detailKakao.removeAttribute("href");
    }
    var q = queryFromMaps(maps);
    if (q) {
      detailMapWrap.hidden = false;
      detailMap.src = "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&output=embed";
    } else {
      detailMapWrap.hidden = true;
      detailMap.removeAttribute("src");
    }
    listView.hidden = true;
    detailEl.hidden = false;
    if (!fromHash && hashId() !== item.id) {
      history.replaceState(null, "", "#" + encodeURIComponent(item.id));
    }
    detailName.focus();
    window.scrollTo(0, 0);
  }

  function openFromHash() {
    var id = hashId();
    if (!id) return;
    var found = null;
    items.forEach(function (item) { if (item.id === id) found = item; });
    if (found) showDetail(found, true);
  }

  function visibleItems(list) {
    if (filter === "Cyrill") {
      return list.filter(function (item) { return item.from === "Cyrill"; });
    }
    return list.slice();
  }

  function renderBucket(list) {
    listEl.innerHTML = "";
    var shown = visibleItems(list);
    if (!shown.length) {
      var empty = document.createElement("li");
      empty.className = "bucket-empty";
      empty.textContent = filter === "Cyrill" ? "Keine Orte von Cyrill." : "Noch keine Wünsche in der Liste.";
      listEl.appendChild(empty);
      return;
    }
    shown.sort(function (a, b) { return a.name.localeCompare(b.name, "de"); });
    shown.forEach(function (item) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "bucket-entry";
      var top = document.createElement("span");
      top.className = "bucket-entry-top";
      var name = document.createElement("span");
      name.className = "bucket-entry-name";
      name.textContent = item.name;
      top.appendChild(name);
      if (item.from === "Cyrill") {
        var tag = document.createElement("span");
        tag.className = "bucket-from";
        tag.textContent = "Cyrill";
        top.appendChild(tag);
      }
      btn.appendChild(top);
      if (item.note) {
        var note = document.createElement("span");
        note.className = "bucket-entry-note";
        note.textContent = item.note;
        btn.appendChild(note);
      }
      btn.addEventListener("click", function () { showDetail(item, false); });
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  document.getElementById("bucket-back").addEventListener("click", showList);
  document.querySelectorAll(".bucket-filter-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      document.querySelectorAll(".bucket-filter-btn").forEach(function (other) {
        var on = other === btn;
        other.classList.toggle("is-on", on);
        other.setAttribute("aria-pressed", on ? "true" : "false");
      });
      renderBucket(items);
    });
  });
  window.addEventListener("hashchange", openFromHash);
  detailName.tabIndex = -1;

  fetch("https://api.github.com/repos/yelggy/seoul26/contents/bucket", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { if (!r.ok) throw new Error("list"); return r.json(); })
    .then(function (files) {
      var jsonFiles = (files || []).filter(function (f) { return f && f.type === "file" && /\.json$/i.test(f.name); });
      return Promise.all(jsonFiles.map(function (f) {
        return fetch(f.download_url).then(function (r) { return r.ok ? r.json() : null; }).then(function (doc) {
          if (doc && typeof doc === "object") doc._file = f.name.replace(/\.json$/i, "");
          return doc;
        }).catch(function () { return null; });
      }));
    })
    .then(function (docs) {
      items = [];
      var skipped = 0;
      (docs || []).forEach(function (doc) {
        if (!doc || typeof doc !== "object") return;
        var images = Array.isArray(doc.images) ? doc.images.map(function (p) { return String(p || "").trim(); }).filter(safeImage) : [];
        var item = {
          id: String(doc._file || "").trim(),
          name: String(doc.name || "").trim(),
          when: String(doc.when || "").trim(),
          note: String(doc.note || "").trim(),
          maps: String(doc.maps || "").trim(),
          photos: String(doc.photos || "").trim(),
          lat: finiteCoord(doc.lat),
          lng: finiteCoord(doc.lng),
          images: images,
          from: String(doc.from || "").trim()
        };
        if (!item.name || !item.id) return;
        var blob = [item.name, item.when, item.note, item.maps, item.photos, item.from].concat(images).join("\n");
        if (looksSensitive(blob)) {
          skipped += 1;
          return;
        }
        items.push(item);
      });
      renderBucket(items);
      openFromHash();
      if (skipped) toast("Übersprungen: " + skipped + " sensible Datei" + (skipped === 1 ? "" : "en"));
    })
    .catch(function () {
      listEl.innerHTML = '<li class="bucket-empty">Die Bucketlist konnte nicht geladen werden.</li>';
    });
})();
  </script>
</body>
</html>
