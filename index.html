<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seoul 26 — Route</title>
  <meta name="description" content="Seoul 26 · Route · 5.–17. Oktober 2026.">
  <meta name="theme-color" content="#0a0a0c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seoul 26 — Route">
  <meta property="og:description" content="Route · Zürich → München → Seoul · 5.–17. Oktober 2026.">
  <meta property="og:url" content="https://yelggy.github.io/seoul26/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Seoul 26 — Route">
  <meta name="twitter:description" content="Route · Zürich → München → Seoul · 5.–17. Oktober 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css?v=6">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="hero-kicker">Nachtroute</p>
      <h1>Seoul 26</h1>
      <p class="hero-sub" id="trip-dates">5.–17. Oktober 2026</p>
      <nav class="tabs" aria-label="Seiten">
        <a href="./" aria-current="page">Route</a>
        <a href="./wunschliste.html">Wunschliste</a>
      </nav>
    </header>

    <div class="legend" aria-hidden="true">
      <span><i class="dot dot-flight"></i> Flug</span>
      <span><i class="dot dot-stay"></i> Aufenthalt</span>
      <span><i class="dot dot-car"></i> Auto</span>
    </div>

    <ol class="route" id="route" aria-label="Routenstopps"></ol>

    <footer class="footer">
      <p>Seoul 26</p>
      <p><a href="https://github.com/yelggy/seoul26" target="_blank" rel="noopener noreferrer">GitHub-Repository</a></p>
    </footer>
  </main>

  <script>
(function () {
  "use strict";
  var KIND_LABELS = { flight: "Flug", stay: "Aufenthalt", car: "Auto" };
  var routeEl = document.getElementById("route");
  var datesEl = document.getElementById("trip-dates");
  try {
    ["seoul26-places-v1", "seoul26-places-v2", "seoul26-places-v3", "seoul26-bucket-v1"].forEach(function (key) {
      localStorage.removeItem(key);
    });
  } catch (e) {}

  function renderRoute(places) {
    routeEl.innerHTML = "";
    places.forEach(function (place, index) {
      var li = document.createElement("li");
      li.className = "stop";
      var node = document.createElement("div");
      node.className = "stop-node";
      node.innerHTML = '<div class="node-ring" aria-hidden="true"></div><span class="stop-index">' + String(index + 1).padStart(2, "0") + "</span>";
      var card = document.createElement("article");
      card.className = "card";
      var top = document.createElement("div");
      top.className = "card-top";
      var title = document.createElement("h2");
      title.className = "card-title";
      title.textContent = place.name;
      var badges = document.createElement("div");
      badges.className = "badges";
      var kindBadge = document.createElement("span");
      kindBadge.className = "badge badge-" + place.kind;
      kindBadge.textContent = KIND_LABELS[place.kind] || place.kind;
      badges.appendChild(kindBadge);
      top.appendChild(title);
      top.appendChild(badges);
      card.appendChild(top);
      if (place.when) {
        var when = document.createElement("p");
        when.className = "card-when";
        when.textContent = place.when;
        card.appendChild(when);
      }
      if (place.note) {
        var note = document.createElement("p");
        note.className = "card-note";
        note.textContent = place.note;
        card.appendChild(note);
      }
      if (place.maps && /^https?:\/\//i.test(place.maps)) {
        var links = document.createElement("div");
        links.className = "card-links";
        var a = document.createElement("a");
        a.href = place.maps;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "Karte";
        links.appendChild(a);
        card.appendChild(links);
      }
      li.appendChild(node);
      li.appendChild(card);
      routeEl.appendChild(li);
    });
  }

  fetch("./places.json?v=5")
    .then(function (r) { if (!r.ok) throw new Error("fail"); return r.json(); })
    .then(function (data) {
      if (data.trip && data.trip.dates) datesEl.textContent = data.trip.dates;
      renderRoute((data.places || []).filter(function (place) { return place.kind !== "bucket"; }));
    })
    .catch(function () {
      routeEl.innerHTML = '<p class="empty">Die Route konnte nicht geladen werden.</p>';
    });
})();
  </script>
</body>
</html>
