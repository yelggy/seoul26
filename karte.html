<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korea 26 — Karte</title>
  <meta name="description" content="Korea 26 · Karte · 5.–17. Oktober 2026.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" integrity="sha384-Nq6PQ+9vJPvw7U/VfDELyrWoGQMsy0gi6QShhaSrGzkpF5KkM40csg2leky+YMTd" crossorigin="">
  <link rel="stylesheet" href="./assets/styles.css?v=12">
</head>
<body>
  <main class="wrap wrap-map">
    <header class="hero">
      <p class="hero-kicker">Karte</p>
      <h1>Korea 26</h1>
      <p class="hero-sub">5.–17. Oktober 2026</p>
            <nav class="tabs" aria-label="Seiten">
        <a href="./">Route</a>
        <a href="./wunschliste.html">Bucketlist</a>
        <a href="./shanghai.html">Shanghai</a>
        <a href="./karte.html" aria-current="page">Karte</a>
      </nav>
    </header>

    <div id="korea-map" class="korea-map" role="region" aria-label="Karte der Bucketlist"></div>
    <p class="map-empty" id="map-status" hidden></p>

    <footer class="footer">
      <p>Korea 26</p>
    </footer>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js" integrity="sha384-/L1njH4bbgNt9Uk3HwJ272N9fxJzRBQCxhtwGkZiqgl+Nxpq2ETUNZhNMNV1RgyW" crossorigin=""></script>
  <script>
(function () {
  "use strict";
  var statusEl = document.getElementById("map-status");
  var map = new maplibregl.Map({
    container: "korea-map",
    style: "./assets/liberty-en.json",
    center: [127.8, 36.4],
    zoom: 7,
    attributionControl: false,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false
  });
  map.touchZoomRotate.disableRotation();
  map.on("sourcedata", function () {
    ["openmaptiles", "ne2_shaded"].forEach(function (id) {
      var src = map.getSource(id);
      if (src && src.attribution) src.attribution = "";
    });
  });
  map.addControl(new maplibregl.AttributionControl({
    compact: false,
    customAttribution: '\u00a9 <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> \u00a9 <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> \u00a9 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }), "bottom-right");
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

  function inKorea(lat, lng) {
    return lat >= 33 && lat <= 39.2 && lng >= 124.4 && lng <= 132.1;
  }

  function fail(msg) {
    statusEl.hidden = false;
    statusEl.textContent = msg;
  }

  var bounds = new maplibregl.LngLatBounds();
  var placed = 0;
  var fitted = false;

  function maybeFit() {
    if (!placed || fitted || !map.isStyleLoaded()) return;
    fitted = true;
    map.fitBounds(bounds, { padding: 28, maxZoom: 8 });
  }

  map.on("load", function () {
    map.resize();
    maybeFit();
  });

  fetch("https://api.github.com/repos/yelggy/seoul26/contents/bucket", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { if (!r.ok) throw new Error("list"); return r.json(); })
    .then(function (files) {
      var jsonFiles = (files || []).filter(function (f) { return f && f.type === "file" && /\.json$/i.test(f.name); });
      return Promise.all(jsonFiles.map(function (f) {
        return fetch(f.download_url).then(function (r) { return r.ok ? r.json() : null; }).then(function (doc) {
          if (doc && typeof doc === "object") doc._file = f.name.replace(/\.json$/i, "");
          return doc;
        }).catch(function () { return null; });
      }));
    })
    .then(function (docs) {
      (docs || []).forEach(function (doc) {
        if (!doc || typeof doc !== "object") return;
        var lat = Number(doc.lat);
        var lng = Number(doc.lng);
        var name = String(doc.name || "").trim();
        var id = String(doc._file || "").trim();
        var from = String(doc.from || "").trim();
        if (!name || !id || !isFinite(lat) || !isFinite(lng) || !inKorea(lat, lng)) return;

        var el = document.createElement("button");
        el.type = "button";
        el.className = "map-marker";
        el.setAttribute("aria-label", name);
        var dot = document.createElement("span");
        dot.className = "map-marker-dot";
        dot.setAttribute("aria-hidden", "true");
        var label = document.createElement("span");
        label.className = "map-marker-label";
        label.textContent = name;
        el.appendChild(dot);
        el.appendChild(label);

        var pop = document.createElement("div");
        pop.className = "map-pop";
        var title = document.createElement("strong");
        title.textContent = name;
        pop.appendChild(title);
        if (from === "Cyrill") {
          var tag = document.createElement("span");
          tag.className = "map-pop-from";
          tag.textContent = "Cyrill";
          pop.appendChild(tag);
        }
        var link = document.createElement("a");
        link.href = "./wunschliste.html#" + encodeURIComponent(id);
        link.textContent = "Zum Eintrag";
        pop.appendChild(link);
        var kakao = document.createElement("a");
        kakao.href = "https://map.kakao.com/link/map/" + encodeURIComponent(name) + "," + lat + "," + lng;
        kakao.target = "_blank";
        kakao.rel = "noopener noreferrer";
        kakao.textContent = "In KakaoMap öffnen";
        pop.appendChild(kakao);

        var popup = new maplibregl.Popup({
          offset: 14,
          closeButton: true,
          closeOnClick: true,
          focusAfterOpen: false,
          maxWidth: "240px"
        }).setDOMContent(pop);

        new maplibregl.Marker({ element: el, anchor: "left", offset: [-7, 0] })
          .setLngLat([lng, lat])
          .setPopup(popup)
          .addTo(map);

        bounds.extend([lng, lat]);
        placed += 1;
      });
      if (!placed) {
        fail("Für die Karte liegen noch keine sicheren Orte vor.");
        return;
      }
      maybeFit();
    })
    .catch(function () {
      fail("Die Karte konnte nicht geladen werden.");
    });
})();
  </script>
</body>
</html>
