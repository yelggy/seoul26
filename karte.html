<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korea 26 — Karte</title>
  <meta name="description" content="Korea 26 · Karte · 5.–17. Oktober 2026.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./assets/styles.css?v=9">
</head>
<body>
  <main class="wrap wrap-map">
    <header class="hero">
      <p class="hero-kicker">Karte</p>
      <h1>Korea 26</h1>
      <p class="hero-sub">5.–17. Oktober 2026</p>
      <nav class="tabs" aria-label="Seiten">
        <a href="./">Route</a>
        <a href="./wunschliste.html">Bucketlist</a>
        <a href="./karte.html" aria-current="page">Karte</a>
      </nav>
    </header>

    <div id="korea-map" class="korea-map" role="region" aria-label="Karte der Bucketlist"></div>
    <p class="map-empty" id="map-status" hidden></p>

    <footer class="footer">
      <p>Korea 26</p>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
(function () {
  "use strict";
  var statusEl = document.getElementById("map-status");
  var map = L.map("korea-map", { scrollWheelZoom: true }).setView([36.4, 127.8], 7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  function inKorea(lat, lng) {
    return lat >= 33 && lat <= 39.2 && lng >= 124.4 && lng <= 132.1;
  }

  function fail(msg) {
    statusEl.hidden = false;
    statusEl.textContent = msg;
  }

  fetch("https://api.github.com/repos/yelggy/seoul26/contents/bucket", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { if (!r.ok) throw new Error("list"); return r.json(); })
    .then(function (files) {
      var jsonFiles = (files || []).filter(function (f) { return f && f.type === "file" && /\.json$/i.test(f.name); });
      return Promise.all(jsonFiles.map(function (f) {
        return fetch(f.download_url).then(function (r) { return r.ok ? r.json() : null; }).then(function (doc) {
          if (doc && typeof doc === "object") doc._file = f.name.replace(/\.json$/i, "");
          return doc;
        }).catch(function () { return null; });
      }));
    })
    .then(function (docs) {
      var bounds = [];
      (docs || []).forEach(function (doc) {
        if (!doc || typeof doc !== "object") return;
        var lat = Number(doc.lat);
        var lng = Number(doc.lng);
        var name = String(doc.name || "").trim();
        var id = String(doc._file || "").trim();
        var from = String(doc.from || "").trim();
        if (!name || !id || !isFinite(lat) || !isFinite(lng) || !inKorea(lat, lng)) return;
        var marker = L.marker([lat, lng]).addTo(map);
        marker.bindTooltip(name, {
          permanent: true,
          direction: "right",
          offset: [10, 0],
          opacity: 1,
          className: "marker-label"
        });
        var pop = document.createElement("div");
        pop.className = "map-pop";
        var title = document.createElement("strong");
        title.textContent = name;
        pop.appendChild(title);
        if (from === "Cyrill") {
          var tag = document.createElement("span");
          tag.className = "map-pop-from";
          tag.textContent = "Cyrill";
          pop.appendChild(tag);
        }
        var link = document.createElement("a");
        link.href = "./wunschliste.html#" + encodeURIComponent(id);
        link.textContent = "Zum Eintrag";
        pop.appendChild(link);
        marker.bindPopup(pop);
        bounds.push([lat, lng]);
      });
      if (!bounds.length) {
        fail("Für die Karte liegen noch keine sicheren Orte vor.");
        return;
      }
      map.fitBounds(bounds, { padding: [28, 28], maxZoom: 8 });
    })
    .catch(function () {
      fail("Die Karte konnte nicht geladen werden.");
    });
})();
  </script>
</body>
</html>
